server:
  port: 8081
spring:
  application:
    name: tanwei
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/tanwei?useSSL=false&serverTimezone=UTC
    username: root
    password: aa123
  redis:
    host: 192.168.181.80
    port: 6379
    password: aa123
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
#        enabled: true      # 开启连接池
#      shutdown-timeout: 2000ms # Lettuce 关闭超时时间
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.tanwei.entity # 别名扫描包
logging:
  level:
    com.tanwei: debug